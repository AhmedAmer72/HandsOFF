<svg preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="280" height="34" viewBox="0 0 280 34" role="img"><style>
:root{--ur-metal-hi:#E6C27A;--ur-gold:#A87935;--ur-bronze:#694426;--ur-gold2:#C69A52;--ur-metal-dark:#3B281B;--ur-surface-hi:#28242A;--ur-surface:#171519;--ur-surface-deep:#100F12;--ur-parchment:#E9D8B4;--ur-ink:#3A2A1A;}
</style>
<defs>
