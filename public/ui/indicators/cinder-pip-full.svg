<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="50" height="52" viewBox="0 0 50 52" role="img"><style>
:root{--ur-metal-hi:#E6C27A;--ur-gold:#A87935;--ur-bronze:#694426;--ur-gold2:#C69A52;--ur-metal-dark:#3B281B;--ur-surface-hi:#28242A;--ur-surface:#171519;--ur-surface-deep:#100F12;--ur-parchment:#E9D8B4;--ur-ink:#3A2A1A;}
</style>
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E6C27A"/>
    <stop offset="0.22" stop-color="#A87935"/>
    <stop offset="0.48" stop-color="#694426"/>
    <stop offset="0.72" stop-color="#C69A52"/>
    <stop offset="1" stop-color="#3B281B"/>
  </linearGradient>
  <linearGradient id="metalThin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F1D89B"/>
    <stop offset="0.5" stop-color="#94652F"/>
    <stop offset="1" stop-color="#3A271A"/>
  </linearGradient>
  <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#28242A"/>
    <stop offset="0.55" stop-color="#171519"/>
    <stop offset="1" stop-color="#100F12"/>
  </linearGradient>
  <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="1">
