[package]
name = "underrealm-game"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
underrealm-core = { path = "../core" }
underrealm-engine = { path = "../engine" }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "hazmat"] }
