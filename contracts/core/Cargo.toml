[package]
name = "underrealm-core"
version = "0.1.0"
edition = "2021"
description = "UNDERREALM v10.2 economy, provenance, and policy rules. No chain SDK."

[dependencies]
underrealm-engine = { path = "../engine" }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "hazmat"] }

[dev-dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "hazmat"] }
